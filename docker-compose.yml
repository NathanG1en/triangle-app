version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: triangle_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: triangle_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triangle_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/triangle_events
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
